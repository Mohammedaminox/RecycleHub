<div class="max-w-lg mx-auto mt-10 p-8 bg-white shadow-lg rounded-xl border border-gray-200">
  <h2 class="text-2xl font-bold text-green-700 mb-6 text-center">Connexion</h2>
  <p class="text-gray-600 text-sm text-center mb-4">Connectez-vous et participez au recyclage intelligent ♻️</p>

  <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-4">
    <!-- Email -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Email</label>
      <input type="email" formControlName="email" placeholder="exemple@recyclehub.com"
             class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>

    <!-- Password -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Mot de passe</label>
      <input type="password" formControlName="password" placeholder="••••••••"
             class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>

    <!-- Error Message -->
    <p *ngIf="errorMessage" class="text-red-500 text-sm text-center">{{ errorMessage }}</p>

    <!-- Submit Button -->
    <button type="submit"
            class="w-full bg-green-600 text-white font-semibold py-2 rounded-lg shadow-md hover:bg-green-700 transition">
      Se connecter
    </button>
  </form>

  <!-- Register Redirect -->
  <p class="text-gray-600 text-sm text-center mt-4">
    Pas encore de compte ? <a routerLink="./register" class="text-green-600 font-medium hover:underline">S'inscrire</a>
  </p>
</div>
