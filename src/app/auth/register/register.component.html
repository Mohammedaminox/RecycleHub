<div class="max-w-lg mx-auto mt-10 p-8 bg-white shadow-lg rounded-xl border border-gray-200">
  <h2 class="text-2xl font-bold text-green-700 mb-6 text-center">Créer un Compte</h2>
  <p class="text-gray-600 text-sm text-center mb-4">Rejoignez RecycleHub et contribuez à un monde plus vert 🌱</p>

  <form [formGroup]="registerForm" (ngSubmit)="register()" class="space-y-4">
    <!-- Name -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Nom</label>
      <input type="text" formControlName="name" placeholder="Votre nom"
             class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>

    <!-- Last Name -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Prénom</label>
      <input type="text" formControlName="lastname" placeholder="Votre prénom"
             class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>

    <!-- Address -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Adresse complète</label>
      <input type="text" formControlName="adresse" placeholder="Votre adresse"
             class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>

    <!-- Phone Number -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Numéro de téléphone</label>
      <input type="text" formControlName="phone" placeholder="+212 6 00 00 00 00"
             class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>

    <!-- Date of Birth -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Date de naissance</label>
      <input type="date" formControlName="birthday"
             class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>

    <!-- Email -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Email</label>
      <input type="email" formControlName="email" placeholder="exemple@recyclehub.com"
             class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>

    <!-- Password -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Mot de passe</label>
      <input type="password" formControlName="password" placeholder="••••••••"
             class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>

    <!-- Submit Button -->
    <button type="submit"
            class="w-full bg-green-600 text-white font-semibold py-2 rounded-lg shadow-md hover:bg-green-700 transition">
      S'inscrire
    </button>
  </form>

  <!-- Login Redirect -->
  <p class="text-gray-600 text-sm text-center mt-4">
    Déjà un compte ? <a routerLink="./login" class="text-green-600 font-medium hover:underline">Se connecter</a>
  </p>
</div>
