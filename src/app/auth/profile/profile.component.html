<div class="max-w-lg mx-auto mt-10 p-8 bg-white shadow-lg rounded-xl border border-gray-200">
  <h2 class="text-2xl font-bold text-green-700 mb-6 text-center">Mon Profil</h2>
  <p class="text-gray-600 text-sm text-center mb-4">Gérez votre compte et continuez à recycler pour un avenir plus vert 🌱</p>

  <div class="space-y-4">
    <!-- User Name -->
    <div class="bg-gray-100 p-4 rounded-lg flex justify-between">
      <p class="text-gray-700"><strong>Nom :</strong> {{ user.name }}</p>
      <button class="text-green-600 hover:underline" (click)="editField('name')">Modifier</button>
    </div>

    <!-- Email -->
    <div class="bg-gray-100 p-4 rounded-lg flex justify-between">
      <p class="text-gray-700"><strong>Email :</strong> {{ user.email }}</p>
    </div>

    <!-- Address -->
    <div class="bg-gray-100 p-4 rounded-lg flex justify-between">
      <p class="text-gray-700"><strong>Adresse :</strong> {{ user.adresse }}</p>
      <button class="text-green-600 hover:underline" (click)="editField('adresse')">Modifier</button>
    </div>

    <!-- Phone -->
    <div class="bg-gray-100 p-4 rounded-lg flex justify-between">
      <p class="text-gray-700"><strong>Téléphone :</strong> {{ user.phone }}</p>
      <button class="text-green-600 hover:underline" (click)="editField('phone')">Modifier</button>
    </div>

    <!-- Birthday -->
    <div class="bg-gray-100 p-4 rounded-lg flex justify-between">
      <p class="text-gray-700"><strong>Date de naissance :</strong> {{ user.birthday }}</p>
      <button class="text-green-600 hover:underline" (click)="editField('birthday')">Modifier</button>
    </div>

    <!-- Action Buttons -->
    <div class="space-y-2 mt-6">
      <button (click)="logout()"
              class="w-full bg-red-600 text-white font-semibold py-2 rounded-lg shadow-md hover:bg-red-700 transition">
        Se déconnecter
      </button>

      <button (click)="deleteAccount()"
              class="w-full bg-gray-500 text-white font-semibold py-2 rounded-lg shadow-md hover:bg-gray-600 transition">
        Supprimer mon compte
      </button>
    </div>
  </div>
</div>
